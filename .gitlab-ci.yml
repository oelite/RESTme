variables:
  GIT_SUBMODULE_STRATEGY: recursive
  BUILD_VERSION: $CI_PIPELINE_ID
  BRANCH_NAME: $CI_COMMIT_REF_NAME
  VERSION_SUFFIX: ${CI_COMMIT_REF_NAME}.${CI_PIPELINE_ID}

stages:
  - build
  - test
  - pack
  - deploy

# Manual trigger support (similar to workflow_dispatch)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

build_solution:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - dotnet build --configuration Release --configfile NuGet.config
  artifacts:
    paths:
      - "**/bin/"
      - "**/obj/"
    expire_in: 1 hour

run_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  dependencies:
    - build_solution
  script:
    - dotnet test --configuration Release --no-build --verbosity normal
  artifacts:
    reports:
      junit: "**/TestResults/*.xml"

set_environment:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:9.0
  dependencies:
    - build_solution
  before_script:
    # Set deployment target based on branch
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "DEPLOY_TARGET=nuget.org" >> deploy.env
        echo "NUGET_SOURCE=https://api.nuget.org/v3/index.json" >> deploy.env
        echo "NUGET_API_KEY=$NUGET_ORG_TOKEN" >> deploy.env
      else
        echo "DEPLOY_TARGET=phanes.dev" >> deploy.env
        echo "NUGET_SOURCE=https://packages.services.phanes.technology/v3/index.json" >> deploy.env
        echo "NUGET_API_KEY=$NUGET_TOKEN" >> deploy.env
      fi
  script:
    # Pack core package
    - echo "Packing OElite.Restme (Core)"
    - dotnet pack OElite.Restme/OElite.Restme.csproj --configuration Release --no-build --output ./packages --version-suffix $VERSION_SUFFIX

    # Pack Redis package
    - echo "Packing OElite.Restme.Redis"
    - dotnet pack OElite.Restme.Redis/OElite.Restme.Redis.csproj --configuration Release --no-build --output ./packages --version-suffix $VERSION_SUFFIX

    # Pack RabbitMQ package
    - echo "Packing OElite.Restme.RabbitMQ"
    - dotnet pack OElite.Restme.RabbitMQ/OElite.Restme.RabbitMQ.csproj --configuration Release --no-build --output ./packages --version-suffix $VERSION_SUFFIX

    # Pack Azure package
    - echo "Packing OElite.Restme.Azure"
    - dotnet pack OElite.Restme.Azure/OElite.Restme.Azure.csproj --configuration Release --no-build --output ./packages --version-suffix $VERSION_SUFFIX

    # Pack S3 package
    - echo "Packing OElite.Restme.S3"
    - dotnet pack OElite.Restme.S3/OElite.Restme.S3.csproj --configuration Release --no-build --output ./packages --version-suffix $VERSION_SUFFIX

    # Pack Utils package
    - echo "Packing OElite.Restme.Utils"
    - dotnet pack OElite.Restme.Utils/OElite.Restme.Utils.csproj --configuration Release --no-build --output ./packages --version-suffix $VERSION_SUFFIX

    # List generated packages
    - echo "Generated packages:"
    - ls -la ./packages/*.nupkg
  artifacts:
    paths:
      - ./packages/*.nupkg
      - deploy.env
    expire_in: 1 hour
    reports:
      dotenv: deploy.env

deploy_packages:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:9.0
  dependencies:
    - set_environment
  script:
    - echo "Deploying to $DEPLOY_TARGET"
    - echo "Source $NUGET_SOURCE"
    - dotnet nuget push ./packages/*.nupkg --source $NUGET_SOURCE --api-key $NUGET_API_KEY --skip-duplicate
    - echo "## 🚀 Deployment Summary"
    - echo "**Branch:** $BRANCH_NAME"
    - echo "**Build Number:** $BUILD_VERSION"
    - echo "**Version Suffix:** $VERSION_SUFFIX"
    - echo "**Deployment Target:** $DEPLOY_TARGET"
    - echo "### 📦 Deployed Packages:"
    - echo "- OElite.Restme (Core)"
    - echo "- OElite.Restme.Redis"
    - echo "- OElite.Restme.RabbitMQ"
    - echo "- OElite.Restme.Azure"
    - echo "- OElite.Restme.S3"
    - echo "- OElite.Restme.Utils"

