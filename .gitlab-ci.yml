variables:
  GIT_SUBMODULE_STRATEGY: recursive
  BUILD_VERSION: $CI_PIPELINE_ID
  BRANCH_NAME: $CI_COMMIT_REF_NAME
  VERSION_SUFFIX: ${CI_COMMIT_REF_NAME}.${CI_PIPELINE_ID}
  PROJECTS: |
    OElite.Restme
    OElite.Restme.Redis
    OElite.Restme.RabbitMQ
    OElite.Restme.Azure
    OElite.Restme.S3
    OElite.Restme.Utils
    OElite.Restme.GoogleUtils

stages:
  - build
  - test
  - pack
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

build_solution:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - dotnet restore --configfile NuGet.config
    - dotnet build --configuration Release --configfile NuGet.config
  artifacts:
    paths:
      - "**/bin/"
      - "**/obj/"
    expire_in: 1 hour

run_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  dependencies:
    - build_solution
  script:
    - dotnet test --configuration Release --no-build --verbosity normal
  artifacts:
    reports:
      junit: "**/TestResults/*.xml"

pack_packages:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:9.0
  dependencies:
    - build_solution
  script:
    - while IFS= read -r project || [ -n "$project" ]; do
    - '  if [ -n "$project" ]; then'
    - '    echo "Packing $project"'
    - '    dotnet pack "$project/$project.csproj" --configuration Release --no-build --output ./packages --version-suffix "$VERSION_SUFFIX"'
    - '  fi'
    - done <<< "$PROJECTS"
    - echo "Generated packages:"
    - ls -la ./packages/*.nupkg
  artifacts:
    paths:
      - ./packages/*.nupkg
    expire_in: 1 hour

deploy_packages:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:9.0
  dependencies:
    - pack_packages
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        DEPLOY_TARGET="nuget.org"
        NUGET_SOURCE="https://api.nuget.org/v3/index.json"
        NUGET_KEY=$NUGET_TOKEN
      else
        DEPLOY_TARGET="phanes.dev"
        NUGET_SOURCE="https://packages.services.phanes.technology/v3/index.json"
        NUGET_KEY=$PHANES_API_TOKEN
      fi
      echo "Deploying to $DEPLOY_TARGET (Source: $NUGET_SOURCE)"
      dotnet nuget push "./packages/*.nupkg" --source "$NUGET_SOURCE" --api-key "$NUGET_KEY" --skip-duplicate
      echo "## 🚀 Deployment Summary"
      echo "**Branch:** $BRANCH_NAME"
      echo "**Build Number:** $BUILD_VERSION"
      echo "**Version Suffix:** $VERSION_SUFFIX"
      echo "**Deployment Target:** $DEPLOY_TARGET"
      echo "### 📦 Deployed Packages:"
      while IFS= read -r project || [ -n "$project" ]; do
        if [ -n "$project" ]; then
          echo "- $project"
        fi
      done <<< "$PROJECTS"