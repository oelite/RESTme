variables:
  GIT_SUBMODULE_STRATEGY: recursive
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  # Define projects as multi-line string (easier to manage than space-separated)
  PROJECTS: |
    OElite.Restme
    OElite.Restme.Redis
    OElite.Restme.RabbitMQ
    OElite.Restme.Azure
    OElite.Restme.S3
    OElite.Restme.ClickHouse
    OElite.Restme.GoogleUtils
    OElite.Restme.Kafka
    OElite.Restme.OpenSearch
    OElite.Restme.Utils
    OElite.Restme.MongoDb
    OElite.Restme.RateLimiting
    OElite.Restme.Hosting

# Test projects: unit tests run in CI; integration tests remain local-only
# against the shared oelite-stack (no per-repo containers, per standard 16).
  UNIT_TEST_PROJECTS: |
    tests/OElite.Restme.UnitTests/OElite.Restme.UnitTests.csproj
    tests/OElite.Restme.RateLimiting.UnitTests/OElite.Restme.RateLimiting.UnitTests.csproj
    tests/OElite.Restme.OpenSearch.UnitTests/OElite.Restme.OpenSearch.UnitTests.csproj

stages:
  - version
  - build
  - test
  - pack
  - deploy

# Per CI-PIPELINE-EFFICIENCY-STANDARD.md §1: MR pipelines (merge_request_event) are
# the merge gate; pipelines run on protected branches and manual/web/api triggers only.
# No push pipelines on feature/* or fix/* branches.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

determine_version:
  stage: version
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - |
      # Read current version from first project
      CURRENT_VERSION=$(grep -o '<VersionPrefix>[^<]*' OElite.Restme/OElite.Restme.csproj | cut -d'>' -f2)
      echo "Current version: $CURRENT_VERSION"
      
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        # Production release - use current version from project files
        VERSION_NUMBER="$CURRENT_VERSION"
        echo "Production release version: $VERSION_NUMBER"
      else
        # Pre-release version for develop/feature branches
        VERSION_NUMBER="$CURRENT_VERSION"
        VERSION_SUFFIX="${CI_COMMIT_REF_NAME}.${CI_PIPELINE_ID}"
        echo "Pre-release version: $VERSION_NUMBER-$VERSION_SUFFIX"
      fi
      
      # Export version info for other jobs
      echo "VERSION_NUMBER=$VERSION_NUMBER" > version.env
      echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> version.env
      echo "CURRENT_VERSION=$CURRENT_VERSION" >> version.env
      
      cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 1 hour

build_solution:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  timeout: 15m
  cache:
    key:
      files:
        - NuGet.config
    paths:
      - .nuget/packages
  script:
    - dotnet restore --configfile NuGet.config
    - dotnet build --configuration Release --configfile NuGet.config --no-restore
    # Ensure all specified projects are built (solution build sometimes skips some)
    - |
      echo "Building specified projects:"
      while IFS= read -r project || [ -n "$project" ]; do
        if [ -n "$project" ]; then
          echo "Building $project"
          dotnet build $project/$project.csproj --configuration Release --no-restore
        fi
      done <<< "$PROJECTS"
  artifacts:
    paths:
      - "**/bin/"
      - "**/obj/"
    expire_in: 1 hour

# Unit tests run on every MR-head and protected-branch pipeline (CI-PIPELINE-EFFICIENCY-STANDARD.md §1/§2.4).
# Data-layer integration tests are filtered out of CI and run locally against the shared
# oelite-stack — never against per-repo containers (standard 16, Gate E).
run_unit_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  timeout: 15m
  cache:
    key:
      files:
        - NuGet.config
    paths:
      - .nuget/packages
    policy: pull
  dependencies:
    - build_solution
  script:
    - dotnet restore --configfile NuGet.config
    - |
      while IFS= read -r project || [ -n "$project" ]; do
        if [ -n "$project" ]; then
          echo "Running unit tests for $project"
          dotnet test "$project" --configuration Release --no-restore \
            --filter "Category!=Integration" \
            --logger "junit;LogFilePath=unit-test-results/{assembly}-unit-test-results.xml" \
            --results-directory ./unit-test-results || exit $?
        fi
      done <<< "$UNIT_TEST_PROJECTS"
  artifacts:
    reports:
      junit:
        - "unit-test-results/*.xml"
    paths:
      - "unit-test-results/"
    expire_in: 1 week
    when: always

pack_packages:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  timeout: 15m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  dependencies:
    - build_solution
    - determine_version
    - run_unit_tests
  script:
    # Restore dependencies first
    - dotnet restore --configfile NuGet.config
    # Pack specified projects
    - |
      echo "Packing specified projects with version: $VERSION_NUMBER"
      echo "Version suffix: $VERSION_SUFFIX"
      
      while IFS= read -r project || [ -n "$project" ]; do
        if [ -n "$project" ]; then
          echo "Packing $project"
          if [ -n "$VERSION_SUFFIX" ]; then
            # Pre-release version
            dotnet pack $project/$project.csproj --configuration Release --output ./packages --version-suffix $VERSION_SUFFIX
          else
            # Production release - use version from project file
            dotnet pack $project/$project.csproj --configuration Release --output ./packages
          fi
        fi
      done <<< "$PROJECTS"

    # List generated packages
    - echo "Generated packages:"
    - ls -la ./packages/*.nupkg
  artifacts:
    paths:
      - ./packages/*.nupkg
    expire_in: 1 hour

deploy_packages:
  stage: deploy
  image: mcr.microsoft.com/dotnet/sdk:10.0
  timeout: 15m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        DEPLOY_ENV: development
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        DEPLOY_ENV: production
  environment:
    name: $DEPLOY_ENV
  dependencies:
    - pack_packages
    - determine_version
  script:
    # Set deployment configuration and deploy based on branch
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        DEPLOY_TARGET="nuget.org"
        NUGET_SOURCE="https://api.nuget.org/v3/index.json"
        echo "Deploying to $DEPLOY_TARGET"
        echo "Source: $NUGET_SOURCE"
        echo "Using NuGet.org authentication"
        dotnet nuget push ./packages/*.nupkg --source $NUGET_SOURCE --api-key $NUGET_TOKEN --skip-duplicate
      else
        DEPLOY_TARGET="packages.phanes.ltd"
        NUGET_SOURCE="https://packages.phanes.ltd/v3/index.json"
        echo "Deploying to $DEPLOY_TARGET"
        echo "Source: $NUGET_SOURCE"
        echo "Using Phanes NuGet feed authentication"
        dotnet nuget push ./packages/*.nupkg --source $NUGET_SOURCE --api-key "$PHANES_API_TOKEN" --skip-duplicate
      fi
    - echo "## 🚀 Deployment Summary"
    - echo "**Branch:** $CI_COMMIT_REF_NAME"
    - echo "**Build Number:** $CI_PIPELINE_ID"
    - echo "**Version:** $VERSION_NUMBER$([ -n "$VERSION_SUFFIX" ] && echo "-$VERSION_SUFFIX")"
    - echo "**Deployment Target:** $DEPLOY_TARGET"
    - echo "### 📦 Deployed Packages:"
    - |
      for package in ./packages/*.nupkg; do
        if [ -f "$package" ]; then
          package_name=$(basename "$package" .nupkg)
          echo "- $package_name"
        fi
      done

    # Notify WeCom group
    - |
      MESSAGE=$(cat <<EOF
      {
        "msgtype": "markdown",
        "markdown": {
          "content": "**📦 Package Deployment Notification**\n\n**Repository/Project:** $CI_PROJECT_NAME\n**Branch:** $CI_COMMIT_REF_NAME\n**Version:** $VERSION_NUMBER$([ -n "$VERSION_SUFFIX" ] && echo "-$VERSION_SUFFIX")\n**Deployment Target:** $DEPLOY_TARGET\n**Build Number:** $CI_PIPELINE_ID\n**Packages:**\n$(for package in ./packages/*.nupkg; do if [ -f "$package" ]; then package_name=$(basename "$package" .nupkg); echo "- $package_name"; fi; done | sed ':a;N;$!ba;s/\n/\\n/g')"
        }
      }
      EOF
      )
      curl -X POST -H "Content-Type: application/json" -d "$MESSAGE" $WECOM_DEV_GROUP_ROBOT_WEBHOOK