name: Build and Deploy Packages

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping net-tools dnsutils

      - name: Configure network environment
        run: |
          echo "=== Network Environment Setup ==="
          # Set environment variables to help with SSL/TLS issues
          echo "DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER=0" >> $GITHUB_ENV
          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> $GITHUB_ENV
          echo "DOTNET_RUNNING_IN_CONTAINER=true" >> $GITHUB_ENV
          echo "CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> $GITHUB_ENV
          
          # Check proxy settings
          echo "Proxy environment variables:"
          env | grep -i proxy || echo "No proxy variables set"

      - name: Fix MTU issues
        run: |
          echo "=== MTU Discovery and Fix ==="
          
          # Get current interface and MTU
          IFACE="$(ip route show default 2>/dev/null | awk '/default/ {print $5; exit}' || echo 'eth0')"
          CURRENT_MTU="$(ip link show dev "$IFACE" 2>/dev/null | grep -o 'mtu [0-9]*' | cut -d' ' -f2 || echo '1500')"
          echo "Current interface: $IFACE, Current MTU: $CURRENT_MTU"
          
          # Test path MTU to common endpoints
          echo "Testing path MTU to various endpoints:"
          
          # Function to test MTU
          test_mtu() {
            local host=$1
            local size=$2
            ping -c 1 -M do -s $size $host >/dev/null 2>&1
            return $?
          }
          
          # Test different MTU sizes to api.nuget.org
          echo "Testing MTU path to api.nuget.org..."
          OPTIMAL_MTU=1500
          for test_size in 1472 1450 1430 1400 1380 1350 1300 1280 1250; do
            if test_mtu api.nuget.org $test_size; then
              OPTIMAL_MTU=$((test_size + 28))  # Add IP+ICMP headers
              echo "✓ MTU $OPTIMAL_MTU works (payload $test_size)"
              break
            else
              echo "✗ MTU $((test_size + 28)) failed (payload $test_size)"
            fi
          done
          
          # If we found a smaller optimal MTU, apply it
          if [ "$OPTIMAL_MTU" -lt "$CURRENT_MTU" ]; then
            echo "Adjusting MTU from $CURRENT_MTU to $OPTIMAL_MTU"
            sudo ip link set dev "$IFACE" mtu "$OPTIMAL_MTU" || echo "Failed to set MTU (might not have permissions)"
            
            # Verify the change
            NEW_MTU="$(ip link show dev "$IFACE" 2>/dev/null | grep -o 'mtu [0-9]*' | cut -d' ' -f2)"
            echo "New MTU: $NEW_MTU"
          else
            echo "Current MTU $CURRENT_MTU is optimal"
          fi
          
          # Test basic SSL connectivity after MTU fix
          echo "Testing SSL connectivity to google.com after MTU adjustment:"
          openssl s_client -connect google.com:443 -servername google.com </dev/null 2>&1 | head -10 || echo "SSL test failed"

      - name: Debug - Network connectivity
        run: |
          echo "=== Network Diagnostics ==="
          echo "Current network interfaces:"
          ip addr show || ifconfig -a || echo "Network interface commands not available"
          echo ""
          echo "Default route:"
          ip route show default || route -n || netstat -rn || echo "Route commands not available"
          echo ""
          echo "DNS configuration:"
          cat /etc/resolv.conf
          echo ""
          echo "DNS resolution test:"
          nslookup api.nuget.org || echo "DNS resolution failed for api.nuget.org"
          nslookup packages.services.phanes.technology || echo "DNS resolution failed for phanes.dev"
          echo ""
          echo "Testing connectivity to NuGet sources (after MTU fix):"
          echo "Testing nuget.org with basic connectivity..."
          curl -v --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
            --user-agent "GitHubActions/1.0" \
            --location --fail-with-body \
            --http1.1 \
            https://api.nuget.org/v3/index.json > /dev/null 2>&1 && echo "✓ nuget.org reachable" || echo "✗ Failed to reach nuget.org"
          echo ""
          echo "Testing phanes.dev..."
          curl -v --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
            --user-agent "GitHubActions/1.0" \
            --location --fail-with-body \
            --http1.1 \
            https://packages.services.phanes.technology/v3/index.json > /dev/null 2>&1 && echo "✓ phanes.dev reachable" || echo "✗ Failed to reach phanes.dev"
          echo ""
          echo "Testing GitHub packages..."
          curl -v --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 2 \
            --user-agent "GitHubActions/1.0" \
            --location --fail-with-body \
            --http1.1 \
            https://nuget.pkg.github.com/index.json > /dev/null 2>&1 && echo "✓ GitHub packages reachable" || echo "✗ Failed to reach GitHub packages"
          echo ""
          echo "Testing basic internet connectivity:"
          curl -v --connect-timeout 10 --max-time 20 --http1.1 https://httpbin.org/ip || echo "Basic internet connectivity failed"

      - name: Debug - .NET environment
        run: |
          echo "=== .NET Environment ==="
          echo "Dotnet version:"
          dotnet --version
          echo ""
          echo "Dotnet info:"
          dotnet --info
          echo ""
          echo "NuGet configuration:"
          dotnet nuget list source
          echo ""
          echo "Environment variables:"
          env | grep -E "(DOTNET|NUGET|HTTP)" | sort

      - name: Debug - File system and permissions
        run: |
          echo "=== File System Diagnostics ==="
          echo "Current directory:"
          pwd
          echo ""
          echo "Directory contents:"
          ls -la
          echo ""
          echo "NuGet.config contents:"
          cat NuGet.config || echo "NuGet.config not found"
          echo ""
          echo "Project files:"
          find . -name "*.csproj" -type f | head -10
          echo ""
          echo "Disk space:"
          df -h
          echo ""
          echo "Memory usage:"
          free -h

      - name: Debug - MTU and network settings
        run: |
          echo "=== Network MTU Diagnostics ==="
          echo "Primary interface MTU:"
          IFACE="$(ip route show default 2>/dev/null | awk '/default/ {print $5; exit}' || route -n 2>/dev/null | awk '/^0.0.0.0/ {print $8; exit}' || echo 'eth0')"
          echo "Interface: $IFACE"
          ip link show dev "$IFACE" 2>/dev/null || ifconfig "$IFACE" 2>/dev/null || echo "Cannot determine MTU for interface $IFACE"
          echo ""
          echo "Testing with different MTU sizes:"
          echo "Testing with current MTU..."
          ping -c 3 -M do -s 1380 8.8.8.8 || echo "Large packet failed"
          echo "Testing with smaller MTU..."
          ping -c 3 -M do -s 1372 8.8.8.8 || echo "Smaller packet failed"
          echo "Testing with smaller MTU..."
          ping -c 3 -M do -s 1280 8.8.8.8 || echo "Smaller packet failed"

#      - name: Set NuGet environment variables
#        run: |
#          echo "DOTNET_NUGET_SIGNATURE_VERIFICATION=false" >> $GITHUB_ENV
#          echo "DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER=0" >> $GITHUB_ENV
#          echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> $GITHUB_ENV
#          echo "DOTNET_RUNNING_IN_CONTAINER=true" >> $GITHUB_ENV
#          echo "DOTNET_EnableWriteXorExecute=0" >> $GITHUB_ENV

      - name: Restore dependencies
        run: |
          echo "Starting dotnet restore with network-friendly settings..."
          
          # # Clear any existing NuGet caches that might be corrupted
          # dotnet nuget locals all --clear
          
          # Try restore with retries and network-friendly settings
          for attempt in 1 2 3; do
            echo "Restore attempt $attempt/3..."
            if timeout 300 dotnet restore --configfile NuGet.config \
              --disable-parallel \
              --verbosity detailed \
              --runtime ubuntu.20.04-x64 \
              --no-cache; then
              echo "✓ Restore successful on attempt $attempt"
              break
            else
              echo "✗ Restore attempt $attempt failed"
              if [ $attempt -eq 3 ]; then
                echo "All restore attempts failed. Checking diagnostics..."
                echo "Checking for any partial restore artifacts:"
                find ~/.nuget -name "*.tmp" -o -name "*.lock" 2>/dev/null | head -10
                echo "Checking running processes:"
                ps aux | grep -E "(dotnet|nuget)" | grep -v grep
                echo "NuGet cache contents:"
                ls -la ~/.nuget/packages/ | head -20 || echo "No packages cache found"
                exit 1
              fi
              echo "Waiting 30 seconds before retry..."
              sleep 30
            fi
          done

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Set environment variables
        run: |
          echo "BUILD_VERSION=${{ github.run_number }}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${{ github.head_ref || github.ref_name }}" >> $GITHUB_ENV
          echo "VERSION_SUFFIX=${{ github.head_ref || github.ref_name }}.${{ github.run_number }}" >> $GITHUB_ENV
          
          # Set deployment target based on branch
          if [ "${{ github.head_ref || github.ref_name }}" = "main" ]; then
            echo "DEPLOY_TARGET=nuget.org" >> $GITHUB_ENV
            echo "NUGET_SOURCE=https://api.nuget.org/v3/index.json" >> $GITHUB_ENV
            echo "NUGET_TOKEN=${{ secrets.NUGET_ORG_TOKEN }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_TARGET=phanes.dev" >> $GITHUB_ENV
            echo "NUGET_SOURCE=https://packages.services.phanes.technology/v3/index.json" >> $GITHUB_ENV
            echo "NUGET_TOKEN=${{ secrets.NUGET_TOKEN }}" >> $GITHUB_ENV
          fi

      - name: Pack core package
        run: |
          echo "Packing OElite.Restme (Core)"
          dotnet pack OElite.Restme/OElite.Restme.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            --version-suffix ${{ env.VERSION_SUFFIX }}

      - name: Pack Redis package
        run: |
          echo "Packing OElite.Restme.Redis"
          dotnet pack OElite.Restme.Redis/OElite.Restme.Redis.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            --version-suffix ${{ env.VERSION_SUFFIX }}

      - name: Pack RabbitMQ package
        run: |
          echo "Packing OElite.Restme.RabbitMQ"
          dotnet pack OElite.Restme.RabbitMQ/OElite.Restme.RabbitMQ.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            --version-suffix ${{ env.VERSION_SUFFIX }}

      - name: Pack Azure package
        run: |
          echo "Packing OElite.Restme.Azure"
          dotnet pack OElite.Restme.Azure/OElite.Restme.Azure.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            --version-suffix ${{ env.VERSION_SUFFIX }}

      - name: Pack S3 package
        run: |
          echo "Packing OElite.Restme.S3"
          dotnet pack OElite.Restme.S3/OElite.Restme.S3.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            --version-suffix ${{ env.VERSION_SUFFIX }}

      - name: Pack Utils package
        run: |
          echo "Packing OElite.Restme.Utils"
          dotnet pack OElite.Restme.Utils/OElite.Restme.Utils.csproj \
            --configuration Release \
            --no-build \
            --output ./packages \
            --version-suffix ${{ env.VERSION_SUFFIX }}

      - name: List packages
        run: |
          echo "Generated packages:"
          ls -la ./packages/*.nupkg

      - name: Deploy to NuGet
        run: |
          echo "Deploying to ${{ env.DEPLOY_TARGET }}"
          echo "Source: ${{ env.NUGET_SOURCE }}"
          
          # Push all packages
          dotnet nuget push ./packages/*.nupkg \
            --source ${{ env.NUGET_SOURCE }} \
            --api-key ${{ env.NUGET_TOKEN }} \
            --skip-duplicate

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ env.BRANCH_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** \`${{ env.BUILD_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version Suffix:** \`${{ env.VERSION_SUFFIX }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Target:** \`${{ env.DEPLOY_TARGET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Packages:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`OElite.Restme\` (Core)" >> $GITHUB_STEP_SUMMARY
          echo "- \`OElite.Restme.Redis\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`OElite.Restme.RabbitMQ\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`OElite.Restme.Azure\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`OElite.Restme.S3\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`OElite.Restme.Utils\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Package Source:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.DEPLOY_TARGET }}" = "nuget.org" ]; then
            echo "Packages are available on [NuGet.org](https://www.nuget.org/packages/OElite.Restme/)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Packages are available on [Phanes Dev Feed](https://packages.services.phanes.technology/v3/index.json)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ env.BRANCH_NAME }}-${{ env.BUILD_VERSION }}
          path: ./packages/*.nupkg
          retention-days: 30

  # Separate job for main branch to create GitHub release
  create-release:
    if: github.ref == 'refs/heads/main'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-main-${{ github.run_number }}
          path: ./packages

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## 🚀 OElite.Restme v${{ github.run_number }}
            
            ### 📦 Packages Released
            - **OElite.Restme** (Core) - Unified REST client with modular architecture
            - **OElite.Restme.Redis** - Redis caching and queuing provider
            - **OElite.Restme.RabbitMQ** - RabbitMQ message queuing provider
            - **OElite.Restme.Azure** - Azure Blob Storage provider with caching
            - **OElite.Restme.S3** - S3-compatible storage provider (AWS, Backblaze, MinIO, etc.)
            - **OElite.Restme.Utils** - Utility extensions and helpers
            
            ### 🆕 Features
            - Modular architecture with dynamic provider loading
            - S3-compatible provider support (Backblaze B2, MinIO, DigitalOcean Spaces, etc.)
            - Cache providers for Azure Blob Storage and S3 (CDN-ready)
            - Enhanced connection string parsing
            - Improved error handling and logging
            
            ### 📥 Installation
            ```bash
            # Core package
            Install-Package OElite.Restme
            
            # Backend providers (optional)
            Install-Package OElite.Restme.Redis
            Install-Package OElite.Restme.RabbitMQ
            Install-Package OElite.Restme.Azure
            Install-Package OElite.Restme.S3
            ```
            
            ### 🔗 Links
            - [NuGet Package](https://www.nuget.org/packages/OElite.Restme/)
            - [Documentation](https://github.com/${{ github.repository }}/blob/main/readme.md)
          files: ./packages/*.nupkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}